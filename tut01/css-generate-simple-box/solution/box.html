<html>
<head>
	<title>Box</title>
	<style type="text/css">
		.box {

			background-color: rgb(255,255,0);
		}
		.box2 {
			width: 200px;
			height: 100px;

			border-right: 4px dashed #0000FF;
			border-radius: 10px;
			background-color: rgba(0, 128, 255, 0.3);
			margin: 20px;
		}
	</style>
</head>
<body>
	<div class="box">

	</div>
	<div class="box2">

	</div>

</html>
