<html>
    <head>
        <title>Box</title>
        <!--Task 1:-->
        <style type="text/css">
            .box {
                width: 100px;
                height: 50px;
                padding: 3px;
                border: 1px solid #333333; /* Width, style, color. */

                /* Properties that deal with four sides of an element (for ex. margin,
                padding, border-width) have shorthand syntax you can use:

                1. If there's one value, it applies to all four sides.
                2. If there are two values, the first is top/bottom, second is left/right.
                3. If there are three values, first is top, second is left/right, third is bottom.
                4. If there are four values, it goes in the order or top, right, bottom, left.
                */
                margin: 10px 5px; /* This means 10px top/bottom. and 5px left/right. */
                background-color: rgb(255, 255, 0);
            }
        </style>
    </head>
    <body>
        <div class="box"></div>
    </body>
</html>
