<html>
<head>
	<title>Flex Layout 2</title>
</head>
<body>
	<div style="display: flex; flex-direction: column; width: 1000px; height: 600px;">
		<div style="display: flex; flex-direction: row; justify-content: space-between; height: 80px; background: #8e44ad;">
		</div>
		<div style="display: flex; flex-direction: row; flex: 1;">
			<div style="width: 200px; background: #16a085;">
			</div>
			<div style="display: flex; flex-direction: column; flex: 1;">
				<div style="display: flex; flex-direction: row; flex: 2;">
					<div style="flex: 2; background: #e74c3c;"></div>
					<div style="flex: 1; background: #2980b9;"></div>
				</div>
				<div style="flex: 1; background: #f1c40f;">
				</div>
			</div>
		</div>
		<div style="display: flex; flex-direction: row; justify-content: space-evenly; height: 60px; background: #e67e22;">
		</div>
	</div>
</body>
</html>
